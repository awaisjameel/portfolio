<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Social preview</title>
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        background: #141210;
        color: #efebe4;
        font-family: 'Segoe UI', system-ui, sans-serif;
      }
      main {
        box-sizing: border-box;
        width: 1200px;
        height: 630px;
        padding: 72px 80px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .mark {
        font-family: Consolas, 'Cascadia Mono', monospace;
        font-size: 34px;
      }
      .mark span {
        color: #f08a45;
      }
      h1 {
        margin: 0;
        font-size: 74px;
        line-height: 1.08;
        letter-spacing: -2px;
        font-weight: 600;
      }
      p {
        margin: 0;
        font-family: Consolas, 'Cascadia Mono', monospace;
        font-size: 26px;
        color: #a59f94;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark"><span>~/</span>awaisjameel</div>
      <h1>I build reliable SaaS products and solve complex integration problems.</h1>
      <p>Senior Full-Stack Engineer · Software Architect</p>
    </main>
  </body>
</html>
