<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Share card</title>
    <style>
      /* fonts */
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #141210;
        color: #efebe4;
        font-family: 'Instrument Sans', sans-serif;
      }
      main {
        box-sizing: border-box;
        width: 1200px;
        height: 630px;
        padding: 60px 72px 48px;
        display: flex;
        flex-direction: column;
        gap: 32px;
      }
      .top {
        flex: 1;
        min-height: 0;
        display: flex;
        justify-content: space-between;
        gap: 56px;
      }
      .head {
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .path,
      footer,
      .value {
        font-family: 'JetBrains Mono', monospace;
      }
      .path {
        margin: 0 0 auto;
        font-size: 28px;
        color: #a59f94;
      }
      .path span {
        color: #f08a45;
      }
      h1 {
        margin: 28px 0 0;
        font-size: 76px;
        line-height: 1.08;
        letter-spacing: -1.5px;
        font-weight: 600;
      }
      h1.long {
        font-size: 54px;
        letter-spacing: -1px;
      }
      .context {
        margin: 20px 0 auto;
        font-size: 30px;
        line-height: 1.3;
        color: #a59f94;
      }
      .portrait {
        flex: none;
        width: 200px;
        height: 200px;
        border-radius: 12px;
      }
      .stats {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: 1fr;
        gap: 40px;
        margin: 0;
        padding-top: 26px;
        border-top: 1px solid #2d2a25;
      }
      .value {
        margin: 0;
        font-size: 36px;
        font-weight: 500;
        color: #f08a45;
        white-space: nowrap;
      }
      .label {
        margin: 6px 0 0;
        font-size: 22px;
        line-height: 1.25;
        color: #a59f94;
        text-wrap: balance;
      }
      footer {
        display: flex;
        justify-content: space-between;
        font-size: 22px;
        color: #a59f94;
      }
    </style>
  </head>
  <body>
    <!-- card -->
  </body>
</html>
